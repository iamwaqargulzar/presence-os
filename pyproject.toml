[project]
name = "presence-os"
version = "0.0.0"
description = "Presence OS control plane"
requires-python = "==3.15.*"
dependencies = [
    "django==6.1.3",
    "psycopg[binary]==3.3.9",
    "temporalio==1.36.1",
]

[dependency-groups]
dev = [
    "django-stubs==6.1.2",
    "jsonschema==4.26.0",
    "mypy==2.4.1",
    "ruff==0.17.6",
]

[tool.uv]
package = false
required-version = "==0.13.10"

[tool.ruff]
target-version = "py315"
line-length = 120
src = ["apps/core", "apps/worker"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests.py" = ["S"]
"**/tests/*.py" = ["S"]
# CI tools run fixed commands from this repository by design.
"tools/*.py" = ["S603", "S607"]

[tool.mypy]
strict = true
mypy_path = "apps/core:apps/worker"
plugins = ["mypy_django_plugin.main"]
exclude = ["^apps/web/"]

[tool.django-stubs]
django_settings_module = "presence_core.settings"

[[tool.mypy.overrides]]
# shortcut: jsonschema ships no type hints and is used only in one test; add types-jsonschema if product code imports it.
module = ["jsonschema.*"]
ignore_missing_imports = true
