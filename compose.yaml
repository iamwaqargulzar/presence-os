# Local and CI test services (ADR-0033 section 4). Bound to 127.0.0.1 only; never expose these ports.
services:
  postgres:
    image: postgres:18.7-trixie@sha256:c699303802144847d238196173655dbbecf7a96aeca1565f2b02eb671a1f0b6b
    environment:
      POSTGRES_DB: ${PRESENCE_DB_NAME:-presence_dev}
      POSTGRES_USER: ${PRESENCE_DB_USER:-presence}
      POSTGRES_PASSWORD: ${PRESENCE_DB_PASSWORD:?set PRESENCE_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PRESENCE_DB_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql

  # Development server only (SQLite in memory, history lost on stop). Production uses PostgreSQL (ADR-0033, R0-009).
  temporal:
    image: temporalio/temporal:1.10.1@sha256:b228dadf9cdb6c7c02a1394b89dd76f827aac9760e458fce42f0899a10141225
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--headless"]
    ports:
      - "127.0.0.1:${PRESENCE_TEMPORAL_PORT:-17233}:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
